<section class="feedback" id="feedback">
    <h2>✉️ Կարծիքներ և առաջարկներ</h2>
    <p>Գրիր քո կարծիքը մեր նախագծի մասին։</p>

    <form action="https://formspree.io/f/https://formspree.io/f/myeeyvon"
          method="POST">

        <label for="name">Անուն</label>
        <input type="text" id="name" name="name"
               placeholder="Գրիր անունդ" required>

        <label for="email">Էլեկտրոնային փոստ (ըստ ցանկության)</label>
        <input type="email" id="email" name="email"
               placeholder="example@gmail.com">

        <label for="message">Քո կարծիքը</label>
        <textarea id="message" name="message"
                  placeholder="Գրիր քո կարծիքը..."
                  rows="5" maxlength="3000" required></textarea>

        <button type="submit">Ուղարկել կարծիքը ➤</button>
    </form>
</section>
