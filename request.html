<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Նախագծային կայք</title>
</head>
    <style>
        
.feedback {
    max-width: 750px;
    margin: 40px auto;
    padding: 30px;
    background: rgba(8, 35, 76, 0.92);
    border: 1px solid #36cfff;
    border-radius: 20px;
    box-shadow: 0 10px 35px #0005;
}

.feedback h2 {
    color: #36cfff;
    text-align: center;
    margin-bottom: 12px;
}

.feedback p {
    text-align: center;
    margin-bottom: 25px;
    color: #e1ebff;
}

.feedback form {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.feedback label {
    color: white;
    font-weight: bold;
}

.feedback input,
.feedback textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #398bdf;
    border-radius: 9px;
    background: #0b2448;
    color: white;
    font: inherit;
}

.feedback input:focus,
.feedback textarea:focus {
    outline: 2px solid #36cfff;
}

.feedback button {
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: linear-gradient(135deg, #087cff, #0753d8);
    color: white;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.feedback button:hover {
    background: #36aaff;
    transform: translateY(-2px);
}

    </style>
<body>
    <button></button>
    <section class="feedback" id="feedback">
        <h2>✉️ Կարծիքներ և առաջարկներ</h2>
        <p>Գրիր քո կարծիքը մեր նախագծի մասին։</p>

        <form action="https://formspree.io/f/https://formspree.io/f/myeeyvon"
              method="POST">

            <label for="name">Անուն</label>
            <input type="text" id="name" name="name"
                   placeholder="Գրիր անունդ" required>

            <label for="email">Էլեկտրոնային փոստ (ըստ ցանկության)</label>
            <input type="email" id="email" name="email"
                   placeholder="example@gmail.com">

            <label for="message">Քո կարծիքը</label>
            <textarea id="message" name="message"
                      placeholder="Գրիր քո կարծիքը..."
                      rows="5" maxlength="3000" required></textarea>

            <button type="submit">Ուղարկել կարծիքը ➤</button>
        </form>
    </section>
</body>
</html>
